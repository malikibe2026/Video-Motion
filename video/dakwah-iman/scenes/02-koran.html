<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="../retro.css">
  <script src="../icons.js"></script>
  <script src="../motion.js"></script>
  <script src="../mouth.js"></script>
  <script src="../man.js"></script>
  <style>
    body { background: var(--cream); }
    :root { --grain-blend: multiply; --grain-opacity: 0.1; }
    /* Newspaper page: masthead rule, columns of grey "type" bars, halftone photo boxes. No readable text. */
    .paper { position: absolute; inset: -40px -700px -40px -120px; background: var(--cream);
      background-image: linear-gradient(90deg, transparent 0 calc(100% - 1px), rgb(27 23 18 / 0.25) 0); background-size: 340px 100%; }
    .rule { position: absolute; left: 0; right: 0; height: 10px; background: var(--ink); opacity: 0.8; }
    .rule.thin { height: 3px; }
    .col { position: absolute; width: 290px; height: 640px;
      background: repeating-linear-gradient(transparent 0 14px, rgb(27 23 18 / 0.2) 14px 24px, transparent 24px 30px); }
    .head-bar { position: absolute; height: 54px; background: rgb(27 23 18 / 0.55); }
    .photo { position: absolute; background-color: var(--cream-2);
      background-image: radial-gradient(circle, rgb(27 23 18 / 0.5) 0 2.2px, transparent 2.6px); background-size: 9px 9px;
      border: 4px solid rgb(27 23 18 / 0.6); }

    /* Camera: fast slide sideways, then the speed ramp drops to slow motion. High angle. */
    .cam-layer { animation: slide 2s both; }
    @keyframes slide {
      0% { transform: translateX(-520px) scale(1.04); animation-timing-function: cubic-bezier(0.1, 0.6, 0.2, 1); }
      22% { transform: translateX(-60px) scale(1.01); animation-timing-function: linear; }
      100% { transform: translateX(0) scale(1); }
    }
    .tilt { position: absolute; inset: 0; transform: rotateX(-8deg); transform-origin: 50% 0%; }
    .man { left: 1120px; top: 90px; transform: scale(1); transform-origin: 50% 0%; }
    .floor-shadow { left: 1160px; top: 960px; }

    .ko2 { position: absolute; left: 110px; top: 120px; font-size: 330px; color: var(--navy); }
    .stampbox { position: absolute; left: 150px; top: 560px; }
    .plan { display: inline-block; font-family: var(--en); font-size: 170px; line-height: 1; color: #b8301b;
      padding: 0.06em 0.3em 0.12em; border: 14px solid currentColor; border-radius: 18px; rotate: -7deg;
      -webkit-mask-image: radial-gradient(circle, #000 0 62%, rgb(0 0 0 / 0.55) 63%); -webkit-mask-size: 7px 7px; }
  </style>
</head>
<body>
  <div class="rig">
    <div class="cam-layer">
      <div class="paper">
        <div class="rule" style="top:40px"></div><div class="rule thin" style="top:62px"></div>
        <div class="head-bar" style="left:40px; top:96px; width:1400px"></div>
        <div class="head-bar" style="left:1600px; top:96px; width:900px; height:40px"></div>
        <div class="col" style="left:30px; top:190px"></div>
        <div class="col" style="left:370px; top:190px"></div>
        <div class="photo" style="left:710px; top:190px; width:630px; height:330px"></div>
        <div class="col" style="left:710px; top:560px; height:470px"></div>
        <div class="col" style="left:1050px; top:560px; height:470px"></div>
        <div class="col" style="left:1390px; top:190px"></div>
        <div class="photo" style="left:1730px; top:190px; width:630px; height:420px"></div>
        <div class="col" style="left:1730px; top:650px; height:380px"></div>
        <div class="col" style="left:2070px; top:650px; height:380px"></div>
        <div class="rule thin" style="top:1040px"></div>
      </div>
      <div class="tilt" data-world>
        <div class="floor-shadow"></div>
        <div class="man" id="man"></div>
      </div>
    </div>
  </div>
  <div class="halftone" data-overlap-ok></div>
  <div class="vignette-print" data-overlap-ok></div>
  <header class="hud" style="inset:0">
    <h1 class="ko ko2 mis-ver m" style="--in:reveal; --t:-0.2s; --in-dur:0.5s">동선</h1>
    <div class="stampbox">
      <span class="plan m" style="--in:slam; --t:-0.02s; --in-dur:0.3s" data-sfx="stamp" data-sfx-intent="stamp">PLAN</span>
    </div>
  </header>
  <script>
    // Left hand (screen left) draws an arc in the air; brows lift.
    MAN.pose(document.getElementById('man'), {
      uL:    [[0, 4], [0.32, 42], [0.55, 46], [1.4, 138, 'lin'], [2, 134]],
      fL:    [[0, 0], [0.32, -12], [0.55, -8], [1.4, 4], [2, 4]],
      handL: [[0, 'rest'], [0.2, 'point']],
      brow:  [[0, 0], [0.45, 0], [0.7, -10], [1.6, -10], [2, -7]],
      headR: [[0, 0], [0.5, -3], [1.5, -5]],
      look:  [[0, 0], [0.5, -3], [1.4, -4]],
    }, 2, { trail: { side: 'l', from: 0.55, to: 1.4, color: '#1d2c55', width: 14, reach: 72 } });
  </script>
</body>
</html>
