<!doctype html><html lang="ms"><head><meta charset="utf-8">
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../story.css">
<script src="../icons.js"></script><script src="../motion.js"></script><script src="../stick.js"></script>
<style></style></head><body>
<div class="bp" style="--tint: rgb(255 110 90 / .07); --glow: rgb(255 110 90 / .08)"></div>
<svg class="world" id="w" viewBox="0 0 1920 1080">
  <path class="ground" d="M200 900 H1720"/>
  <g class="ink"><path d="M670 762 H950"/><path d="M695 762 V900 M925 762 V900"/><path d="M545 828 H655 M560 828 L546 900 M640 828 L654 900"/></g>
  <g class="ink thin" id="stack"></g>
  <g id="bat" transform="translate(530 330)">
    <rect x="0" y="0" width="170" height="78" rx="10" class="ink"/>
    <rect x="172" y="24" width="14" height="30" rx="3" class="ink"/>
    <rect class="bar" x="12" y="12" width="30" height="54" rx="4"/><rect class="bar" x="51" y="12" width="30" height="54" rx="4"/>
    <rect class="bar" x="90" y="12" width="30" height="54" rx="4"/><rect class="bar" x="129" y="12" width="30" height="54" rx="4"/>
  </g>
  <path id="hrt" d="M0 12 C -26 -6, -16 -30, 0 -14 C 16 -30, 26 -6, 0 12 Z" fill="var(--gold)" transform="translate(1110 520) scale(1.6)"/>
</svg>
<p class="say wide m" style="top:110px; --in:rise; --t:-0.2s">Dieksploitasi hingga <em>burnout</em>.</p>
<p class="say wide m" style="top:195px; --in:rise; --t:4.6s">Hingga terpaksa berjumpa <b>kaunselor</b>.</p>
<div class="tag white m" style="left:250px; top:520px; --in:fade; --t:6.6s">KAUNSELOR</div>
<div class="titleblock" data-texture><span>PROJEK</span><span>MALIKI</span><span>LUKISAN</span><span>06 / 26</span></div>
<script>
const st = document.querySelector('#stack');
for (let i = 0; i < 14; i++) Stick.el('rect', { x: 760 + ((i*29)%14) - 7, y: 748 - i*13, width: 150, height: 12, rx: 2, class: 'ink thin', fill: 'var(--bg)' }, st);
Stick.add({ parent:'#w', x:600, y:900, s:1.6, color:'var(--gold)', face:'worried', seed:3,
  keys:[[0,'sitType'],[3.6,'sitType'],[4.4,'sitSlump',0.8],[7.4,'sitSlump'],[8.0,'sit',0.6]], type:[[0,3.6]],
  faceKeys:[[0,'worried'],[3.8,'sad'],[7.6,'neutral']] });
Stick.add({ parent:'#w', x:-200, y:900, s:1.6, dir:1, face:'smile', seed:5,
  move:[[4.4,[-200,900]],[6.4,[400,900],t=>t]], walk:[[4.4,6.4]], keys:[[0,'stand'],[6.4,'stand'],[6.9,'holdOut',0.5]] });
const bars = [...document.querySelectorAll('#bat .bar')], hrt = document.querySelector('#hrt');
__video.on(ms => { const t = ms/1000;
  const left = 4 - Math.floor(Stick.clamp((t - 0.6)/3.2) * 4);
  bars.forEach((b,i) => { b.style.fill = left <= 1 ? 'var(--coral)' : 'var(--gold)'; b.style.opacity = i < Math.max(left, 1) ? (left <= 1 ? (Math.sin(t*9) > 0 ? 1 : 0.35) : 1) : 0.08; });
  const k = Stick.easeOut(Stick.clamp((t - 7.0)/0.6)); const p = 1 + Math.sin(t*5)*0.04;
  hrt.setAttribute('transform', `translate(560 470) scale(${(1.6*k*p).toFixed(3)})`); hrt.style.opacity = k; });
</script></body></html>
