<!doctype html><html lang="ms"><head><meta charset="utf-8">
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../story.css">
<script src="../icons.js"></script><script src="../motion.js"></script><script src="../stick.js"></script>
<style>.bub.s { font-size:34px; padding:10px 20px 12px; }</style></head><body>
<div class="bp" style="--tint: rgb(150 160 180 / .10)"></div>
<svg class="world" id="w" viewBox="0 0 1920 1080">
  <path class="ground" d="M200 900 H1720"/>
  <g id="people"></g>
  <g class="ink"><rect x="520" y="752" width="900" height="40" rx="6" fill="var(--bg)"/><path d="M560 792 V900 M1380 792 V900"/></g>
</svg>
<p class="say wide m" style="top:110px; --in:rise; --t:-0.2s">Dalam mesyuarat, dia <em>dipandang kosong</em>.</p>
<p class="say wide m" style="top:195px; --in:rise; --t:6.0s">Bagi pengarah — sekadar <em>“orang yang layak baca doa”</em>.</p>
<div class="bub s m" style="left:600px; top:440px; --in:pop; --t:0.5s; --out:fade-out; --out-t:2.0s">Bla bla!</div>
<div class="bub s m" style="left:930px; top:420px; --in:pop; --t:1.1s; --out:fade-out; --out-t:2.6s">Setuju!</div>
<div class="bub s m" style="left:1150px; top:450px; --in:pop; --t:1.7s; --out:fade-out; --out-t:3.0s">Saya rasa…</div>
<div class="bub s m" style="left:330px; top:560px; --in:pop; --t:3.0s; --out:fade-out; --out-t:4.6s; color:var(--muted); border-color:var(--muted)">…</div>
<div class="bub gold m" style="left:1290px; top:430px; --in:pop; --t:4.8s; --tail-x:260px">Maliki, baca doa.</div>
<div class="tag white m" style="left:1470px; top:560px; --in:fade; --t:4.4s">PENGARAH</div>
<div class="titleblock" data-texture><span>PROJEK</span><span>MALIKI</span><span>LUKISAN</span><span>12 / 26</span></div>
<script>
const P = '#people';
Stick.add({ parent:P, x:420, y:900, s:1.5, color:'var(--gold)', face:'neutral', keys:[[0,'sit'],[2.8,'sit'],[3.1,'sitTalk',0.3],[3.9,'sit',0.3],[5.6,'sit'],[6.2,'sitDoa',0.5]], faceKeys:[[0,'neutral'],[3.8,'sad'],[6.3,'neutral']] });
[[680,-1,0],[860,1,1],[1050,-1,2],[1230,1,3]].forEach(([x,d,i]) => Stick.add({ parent:P, x, y:900, s:1.5, dir:d, face:'smile', seed:i,
  keys:[[0,'sit'],[0.3+i*0.6,'sit'],[0.5+i*0.6,'sitTalk',0.25],[1.3+i*0.6,'sit',0.3],[6.2,'sit'],[6.6,'sitDoa',0.5]],
  dirKeys: d < 0 ? [[0,-1],[3.5,1],[5.0,-1]] : [[0,1]] }));
Stick.add({ parent:P, x:1520, y:900, s:1.6, dir:-1, face:'neutral', seed:7, keys:[[0,'sit'],[4.6,'sit'],[4.9,'sitTalk',0.3],[5.8,'sit',0.3],[6.4,'sitDoa',0.5]],
  extra:(g, el) => { const tie = el('path', { fill:'none', stroke:'currentColor', 'stroke-width':5, 'stroke-linejoin':'round' }, g);
    return (j) => { const x = j.sh[0], y = j.sh[1]; tie.setAttribute('d', `M${x-6} ${y+6} L${x} ${y+12} L${x+6} ${y+6} M${x} ${y+12} L${x-5} ${y+46} L${x} ${y+54} L${x+5} ${y+46} Z`); }; } });
</script></body></html>
