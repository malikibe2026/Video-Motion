<!doctype html><html lang="ms"><head><meta charset="utf-8">
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../story.css">
<script src="../icons.js"></script><script src="../motion.js"></script><script src="../stick.js"></script>
<style>.bl { position:absolute; width:240px; text-align:center; font-family:var(--mono); font-weight:600; font-size:30px; line-height:1.15; color:var(--fg); transform: translate(-50%,-50%); }</style></head><body>
<div class="bp" style="--tint: rgb(255 190 120 / .05); --glow: rgb(255 190 120 / .10)"></div>
<svg class="world" id="w" viewBox="0 0 1920 1080">
  <path class="ground" d="M520 880 H1400"/>
  <g id="balloons"></g>
</svg>
<div class="bl" id="b0">JAWATAN<br>KOSONG</div><div class="bl" id="b1">MC</div><div class="bl" id="b2">PERHATIAN<br>BOS</div>
<p class="say wide m" style="top:910px; --in:rise; --t:-0.2s; --out:fade-out; --out-t:5.0s">Dia berhenti meminta pengiktirafan daripada <em>orang yang salah</em>.</p>
<p class="say big wide m" style="top:900px; --in:blur; --t:5.6s">Dia belajar <b>melepaskan</b>.</p>
<div class="titleblock" data-texture><span>PROJEK</span><span>MALIKI</span><span>LUKISAN</span><span>22 / 26</span></div>
<script>
const f = Stick.add({ parent:'#w', x:960, y:880, s:1.7, color:'var(--gold)', face:'neutral',
  keys:[[0,{ lean:0, tilt:-6, aB:[-12,-6], aF:[150,165], lB:[-9,-6], lF:[9,6] }],[4.2,{ lean:0, tilt:-6, aB:[-12,-6], aF:[150,165], lB:[-9,-6], lF:[9,6] }],[4.9,'stand',0.6],[6.4,'proud',0.6]],
  faceKeys:[[0,'neutral'],[5.2,'smile'],[6.4,'happy']] });
const bg = document.querySelector('#balloons');
const offs = [[-280,-150],[0,-230],[280,-150]];
const B = offs.map((o,i) => ({ o, e: Stick.el('ellipse', { rx:130, ry:92, class:'ink gold', fill:'rgb(13 42 79 / .6)' }, bg), s: Stick.el('path', { class:'ink thin' }, bg), lab: document.querySelector('#b'+i) }));
__video.on(ms => { const t = ms/1000; const h = f.joints.handF || [960, 500];
  B.forEach((b,i) => {
    const sway = Math.sin(t*1.6 + i*1.3) * 14; const rel = Math.max(0, t - 4.0 - i*0.25);
    const up = 160*rel*rel + 60*rel; const drift = Math.sin(rel*2 + i) * 30 * Math.min(1, rel);
    const cx = (rel > 0 ? h[0] + b.o[0] : h[0] + b.o[0]) + sway + drift, cy = h[1] + b.o[1] - up;
    const ax = rel > 0 ? cx - 10 : h[0], ay = rel > 0 ? cy + 92 + 230 : h[1];
    b.e.setAttribute('cx', cx.toFixed(1)); b.e.setAttribute('cy', cy.toFixed(1));
    b.s.setAttribute('d', `M${cx.toFixed(1)} ${(cy+92).toFixed(1)} Q ${((cx+ax)/2 + 20).toFixed(1)} ${((cy+92+ay)/2).toFixed(1)} ${ax.toFixed(1)} ${ay.toFixed(1)}`);
    b.lab.style.left = cx + 'px'; b.lab.style.top = cy + 'px';
    const vis = Stick.clamp((cy - 120) / 120); b.lab.style.opacity = vis.toFixed(3); b.e.style.opacity = Stick.clamp((cy + 100)/300).toFixed(3); b.s.style.opacity = b.e.style.opacity; }); });
</script></body></html>
